# Guardrail for pull-request preview environments.
# Ensures preview builds never claim APP_ENV=production and reminds operators
# that Preview env vars on the host must stay isolated from production.
name: Preview Isolation Guard

on:
  pull_request:
    branches: [main, develop]

jobs:
  preview-env-guard:
    name: Preview must not use production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject production APP_ENV on PR builds
        run: |
          set -euo pipefail
          # CI / preview builds for PRs must never target production.
          if [ "${APP_ENV:-}" = "production" ] || [ "${NEXT_PUBLIC_APP_ENV:-}" = "production" ]; then
            echo "::error::Pull request builds must not set APP_ENV/NEXT_PUBLIC_APP_ENV=production"
            exit 1
          fi
          echo "OK: PR context is not production APP_ENV"
          echo ""
          echo "Hosting checklist (Vercel Preview / equivalent):"
          echo "- Separate DATABASE_URL (never production)"
          echo "- Test payment credentials only (PAYMENT_MODE=test)"
          echo "- Isolated media bucket/prefix"
          echo "- Distinct AUTH_SECRET / CRON_SECRET"
          echo "- Do not copy Production env into Preview"
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}
